name: Native Node integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/native-node.yml'

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install host networking dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y nftables wireguard-tools openvpn ppp pptp-linux
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile
        run: python -m compileall -q app
      - name: Full Alpha 8.9 regression with kernel networking authority
        run: sudo --preserve-env=PATH,HOME python -m pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
