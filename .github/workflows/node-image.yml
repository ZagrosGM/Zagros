name: Zagros Node image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/node_agent/**', 'app/nodes/**', 'app/cores/**', 'node/**', '.github/workflows/node-image.yml']
  pull_request:
    paths: ['app/node_agent/**', 'app/nodes/**', 'app/cores/**', 'node/**']
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt pytest-asyncio
      - run: pytest -q tests/node_agent tests/cores
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/zagrosgm/zagros-node
          tags: |
            type=raw,value=alpha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
