name: Release

# One unified pipeline for every release line. Tag shapes:
#   v1.2.3              stable        → GitHub Release (not a prerelease) + :latest
#   v1.2.3-alpha.N      alpha channel → prerelease
#   v1.2.3-beta.N       beta channel  → prerelease
#   v1.2.3-rc.N         rc channel    → prerelease
# The image is published EXCLUSIVELY to GitHub Container Registry
# (ghcr.io/zagrosgm/zagros). Docker Hub is not used.
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/zagrosgm/zagros

jobs:
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run the test suite
        run: python -m pytest tests -q

  docker:
    name: Docker build → GHCR (amd64 + arm64)
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ contains(github.ref_name, '-') == false }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # deterministic manifest lists; attestation manifests are noise here
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Channel detection
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *-alpha.*) echo "name=alpha"     >> "$GITHUB_OUTPUT" ;;
            *-beta.*)  echo "name=beta"      >> "$GITHUB_OUTPUT" ;;
            *-rc.*)    echo "name=rc"        >> "$GITHUB_OUTPUT" ;;
            *-*)       echo "name=prerelease" >> "$GITHUB_OUTPUT" ;;
            *)         echo "name=stable"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Zagros ${{ github.ref_name }} (${{ steps.channel.outputs.name }})

            **Image (GHCR only):**

            ```
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            **Install / update on a VPS:**

            ```bash
            # Fresh install, pinned to matching Panel + Scripts tags:
            sudo env ZAGROS_SCRIPTS_REF=${{ github.ref_name }} bash -c "$(curl -fsSL https://raw.githubusercontent.com/ZagrosGM/zagros-scripts/${{ github.ref_name }}/zagros.sh)" -- install --version ${{ github.ref_name }}

            # Existing host: refresh CLI/host-agent/compose first, then update:
            sudo env ZAGROS_SCRIPTS_REF=${{ github.ref_name }} bash -c "$(curl -fsSL https://raw.githubusercontent.com/ZagrosGM/zagros-scripts/${{ github.ref_name }}/zagros.sh)" -- update --version ${{ github.ref_name }}
            ```

            Curated change notes live in [CHANGELOG.md](https://github.com/ZagrosGM/Zagros/blob/main/CHANGELOG.md).
