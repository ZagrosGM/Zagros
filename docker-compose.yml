# Development sample — production installs are generated by the Zagros
# installer (`zagros install`), which renders a full compose project with
# healthchecks and an optional database service.
#
# Configuration contract: compose only MOUNTS the panel's .env file. The
# image hardcodes NOTHING — edit .env, then `docker compose restart` applies
# every setting (edit interactively with `zagros config edit`).
services:
  zagros:
    image: ghcr.io/zagrosgm/zagros:latest
    restart: always
    network_mode: host
    # TUN-based cores (OpenVPN, WireGuard) run INSIDE this container: without
    # the tunnel device + NET_ADMIN their Start dies at interface creation.
    # The installer template grants both; the sample mirrors it. On the HOST
    # you still need the module loaded: `modprobe tun` (LXC/OpenVZ: enable
    # TUN/TAP in the provider panel) and forwarding enabled persistently:
    #   sysctl -w net.ipv4.ip_forward=1
    # Do not add a compose `sysctls:` entry here: network_mode=host shares the
    # host network namespace and Docker cannot mutate that host sysctl safely.
    cap_add:
      - NET_ADMIN
      # Independent ACCEL-PPP PPTP uses GRE protocol 47 raw sockets.
      - NET_RAW
      # Named per-outbound network namespaces require mount/setns authority;
      # the panel still has no Docker socket or host PID namespace.
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      # PPP character device for the default-disabled legacy PPTP provider.
      - /dev/ppp:/dev/ppp
    volumes:
      - ./.env:/code/.env:ro
      - /var/lib/zagros:/var/lib/zagros
