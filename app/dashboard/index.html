<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/statics/zagros.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Zagros — Unified Panel</title>
    <style>
      /* pre-paint: avoid theme flash (script runs before CSS) */
      html { background: #0b0f14; }
      html.light { background: #f4f6f9; }
    </style>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("zagros.ui") || "{}");
          var theme = (p.state && p.state.theme) || "dark";
          var locale = (p.state && p.state.locale) || "en";
          var root = document.documentElement;
          root.classList.toggle("dark", theme !== "light");
          root.classList.toggle("light", theme === "light");
          root.setAttribute("dir", locale === "fa" ? "rtl" : "ltr");
          root.setAttribute("lang", locale);
        } catch (e) { /* ignore — default dark LTR */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
