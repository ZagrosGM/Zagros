# Zagros — Alembic configuration (Phase P3 schema; see app/persistence/)
# Legacy Zagros migrations live untouched under app/db/migrations and are
# superseded by the idempotent importer in app/persistence/migration.py.

[alembic]
script_location = app/persistence/alembic
prepend_sys_path = .
# The URL is resolved at runtime: ZAGROS_DATABASE_URL > SQLALCHEMY_DATABASE_URL > this default.
sqlalchemy.url = sqlite:///zagros.db

[post_write_hooks]
# (formatters may be configured here in the future)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
