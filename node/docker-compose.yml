name: zagros-node
services:
  node:
    image: ${ZAGROS_NODE_IMAGE:-ghcr.io/zagrosgm/zagros-node:alpha}
    container_name: zagros-node
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/ppp:/dev/ppp
    volumes:
      - ${ZAGROS_NODE_DATA:-/var/lib/zagros-node}:/var/lib/zagros-node
      - ${ZAGROS_CORE_DATA:-/var/lib/zagros/cores}:/var/lib/zagros/cores
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
