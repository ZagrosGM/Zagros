name: Zagros Node image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional additional tag (vX.Y.Z or alpha.X.Y)'
        required: false
        type: string

# GITHUB_TOKEN is the only publication credential. Keep this job-scoped and
# deliberately omit actions/write, id-token/write, and repository write access.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zagrosgm/zagros-node

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject credentials in the build context
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          if git grep -IEn -- \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}' \
            -- ':!tests/**' ':!docs/**' ':!.github/workflows/node-image.yml'; then
            echo 'A private key or access-token-shaped value is tracked.' >&2
            exit 1
          fi
          ! git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(key|p12|pfx))$'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Test native Node and core providers
        run: |
          pip install -r requirements.txt pytest-asyncio
          pytest -q tests/node_agent tests/cores

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate manual tag
        id: manual
        shell: bash
        env:
          REQUESTED: ${{ inputs.version_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED" && ! "$REQUESTED" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|alpha\.[0-9A-Za-z.-]+)$ ]]; then
            echo 'version_tag must be vX.Y.Z[-suffix] or alpha.X' >&2
            exit 2
          fi
          echo "enabled=$([[ -n "$REQUESTED" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=alpha
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.manual.outputs.tag }},enable=${{ steps.manual.outputs.enabled == 'true' }}
          labels: |
            org.opencontainers.image.title=Zagros Node
            org.opencontainers.image.description=Native multi-core Zagros data-plane agent
            org.opencontainers.image.source=https://github.com/ZagrosGM/Zagros
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Authenticate to GHCR with repository GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zagros-node
          cache-to: type=gha,mode=max,scope=zagros-node
          provenance: mode=max
          sbom: true

      - name: Pull immutable published tag from GHCR
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERIFY_IMAGE="${IMAGE}:sha-${SHORT_SHA}"
          docker image rm "$VERIFY_IMAGE" >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "$VERIFY_IMAGE"
          DIGEST=$(docker image inspect "$VERIFY_IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$DIGEST" == "$IMAGE@sha256:"* ]]
          echo "image=$VERIFY_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Validate published Node runtime and TLS startup
        shell: bash
        env:
          VERIFY_IMAGE: ${{ steps.verify.outputs.image }}
        run: |
          set -euo pipefail
          STATE=$(mktemp -d)
          CORES=$(mktemp -d)
          cleanup() { docker rm -f zagros-node-ci >/dev/null 2>&1 || true; rm -rf "$STATE" "$CORES"; }
          trap cleanup EXIT
          TOKEN=$(openssl rand -hex 32)
          TOKEN_HASH=$(printf %s "$TOKEN" | sha256sum | awk '{print $1}')
          unset TOKEN
          docker run -d --name zagros-node-ci \
            -p 127.0.0.1:62050:62050 \
            -e ZAGROS_NODE_NAME=ci-node \
            -e ZAGROS_NODE_ADDRESS=ci-node \
            -e ZAGROS_NODE_REGISTRATION_HASH="$TOKEN_HASH" \
            -v "$STATE:/var/lib/zagros-node" \
            -v "$CORES:/var/lib/zagros/cores" \
            "$VERIFY_IMAGE"
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect zagros-node-ci --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
            [[ "$STATUS" == healthy ]] && break
            [[ "$(docker inspect zagros-node-ci --format '{{.State.Running}}')" == true ]] || {
              docker logs zagros-node-ci; exit 1;
            }
            sleep 2
          done
          [[ "$(docker inspect zagros-node-ci --format '{{.State.Health.Status}}')" == healthy ]]
          docker exec zagros-node-ci python -c \
            'from app.node_agent.app import NODE_CORE_ALLOWLIST; assert NODE_CORE_ALLOWLIST == {"xray","sing-box","openvpn","wireguard","ssh","softether","pptp"}'
          echo | openssl s_client -connect 127.0.0.1:62050 -servername ci-node 2>/dev/null | \
            openssl x509 -noout -subject
          docker image inspect "$VERIFY_IMAGE" --format '{{json .Config.Labels}}' | \
            grep -q 'https://github.com/ZagrosGM/Zagros'
          ! docker image history --no-trunc "$VERIFY_IMAGE" | \
            grep -E 'github_pat_|ghp_|BEGIN .*PRIVATE KEY'
